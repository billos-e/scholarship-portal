services:
  postgres:
    image: postgres:16-alpine
    container_name: scholarship-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: scholarship
      POSTGRES_PASSWORD: scholarship_dev
      POSTGRES_DB: scholarship
    volumes:
      - scholarship_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarship -d scholarship"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  scholarship_pgdata:
