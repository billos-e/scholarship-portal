kind = "web"
previewPath = "/"
title = "Scholarship Portal"
version = "1.0.0"
id = "artifacts/scholarship-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18470

[services.development]
run = "pnpm --filter @workspace/scholarship-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scholarship-portal", "run", "build" ]
publicDir = "artifacts/scholarship-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18470"
BASE_PATH = "/"
